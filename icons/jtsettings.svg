<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8D8D8"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="112" fill="url(#glow)"/>
  <circle cx="128" cy="126" r="98" fill="url(#disc)" stroke="#404040" stroke-width="2"/>

  <!-- cog teeth -->
  <g fill="url(#gear)">
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(0 128 128)"/>
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(45 128 128)"/>
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(90 128 128)"/>
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(135 128 128)"/>
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(180 128 128)"/>
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(225 128 128)"/>
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(270 128 128)"/>
    <rect x="119" y="48" width="18" height="30" rx="5" transform="rotate(315 128 128)"/>
  </g>

  <!-- cog body and centre hole -->
  <circle cx="128" cy="128" r="58" fill="none" stroke="url(#gear)" stroke-width="16"/>
  <circle cx="128" cy="128" r="26" fill="#0A0A0C" stroke="url(#gear)" stroke-width="8"/>

  <!-- status bead -->
  <circle cx="193" cy="155" r="6" fill="#66B366"/>
</svg>
